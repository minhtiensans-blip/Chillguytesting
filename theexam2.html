<div id="timer-container" style="width: 80%; max-width: 600px; margin: 10px auto; text-align: center;">

        <div id="timer-bar" style="width: 100%; height: 100%; background-color: #4caf50; transition: width 0.1s linear;"></div>
    </div>
</div>

<p id="timeText"></p>

<div class="container">


<h1 class="h1">

</h1>

</h2>

</button>

B
</button>


<button class="answer" id="C" onclick="Answer('C')">
C
</button>


<button class="answer" id="D" onclick="Answer('D')">
D
</button>



<h2 id="score">
Score:0
</h2>
<br>

</a>
