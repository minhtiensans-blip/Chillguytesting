<!DOCTYPE html>
<html>
<head>
    <title>Chill Guy Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<!-- Filter Select ở Top Right -->
<div class="top-right-filter">
    <select id="filterLevel" class="select" onchange="renderLeaderboard()">
        <option value="1">All</option>
        <option value="2">Easy</option>
        <option value="3">Medium</option>
        <option value="4">Hard</option>
        <option value="5">Impossible</option>
    </select>
</div>

<div class="container">
    <h1 id="h1">LEADERBOARD</h1>
    
    <!-- Danh sách các item leaderboard -->
    <div id="leaderboard-list"></div>
</div>

<script src="script.js"></script>
</body>
</html>
