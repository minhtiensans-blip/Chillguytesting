
<!DOCTYPE html>
<html>

<head>
    <title>Chill Guy Testing</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>


<body>

<div class="container">

    <h1 id="h1">Are you really a chill guy?</h1>

    <hr id="hr1">


    <div>
        <input 
            type="text" 
            id="input1" 
            placeholder="Enter your name">
    </div>


    <br>


    <label id="label1">
        Choose your difficulty:
    </label>


    <br>


    <select id="selection1">

        <option value="1">Easy</option>

        <option value="2">Medium</option>

        <option value="3">Hard</option>

        <option value="4">Impossible</option>

    </select>


    <br><br>


    <div>
<button 
    id="button1" 
    class="btn"
    onclick="selectcheck()">

    Get the exam

</button>
    </div>



    <div>

        <a href="chillguystanding.html">

            <img 
                src="chill guy.png" 
                alt="Chill Guy"
                height="500px"
                width="400px">

        </a>

    </div>


</div>



<script src="script.js"></script>


</body>

</html>
